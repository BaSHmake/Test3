<!DOCTYPE html>
<html>
<head>
<style>
    body {
        background: var(--bluat);
    }
    :root {
        --bluat: #0b0b0b;
    }
    :root:has(#check:checked) {
        --bluat: red;
    }
    #check {
        display: none;
    }
</style>
</head>
<body>
    <input type="checkbox" id="check">
    <label for="check">Кликни меня</label>
    <p>Если фон станет красным — :has() работает.</p>
</body>
</html>
